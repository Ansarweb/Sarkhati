name: Sarkhati Safe Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  safe-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run syntax check
        run: python -m py_compile main.py

      - name: Show Tehran time
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print("Tehran time:", datetime.now(ZoneInfo("Asia/Tehran")))
          print("Sarkhati safe test is ready.")
          print("No orders were sent.")
          PY
