
name: Sarkhati Safe Test

on:
  workflow_dispatch:
    inputs:
      target_time:
        description: "Target time in Tehran, HH:MM"
        required: true
        default: "19:28"
        type: string
      prep_minutes:
        description: "Minutes before target to start testing"
        required: true
        default: "3"
        type: choice
        options:
          - "3"
          - "5"
          - "10"
      interval:
        description: "Seconds between connection tests"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "5"

permissions:
  contents: read

jobs:
  safe-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Run scheduled safe connection test
        env:
          TARGET_TIME: ${{ inputs.target_time }}
          PREP_MINUTES: ${{ inputs.prep_minutes }}
          TEST_INTERVAL: ${{ inputs.interval }}
        run: |
          python -u main.py \
            --target-time "$TARGET_TIME" \
            --prep-minutes "$PREP_MINUTES" \
            --interval "$TEST_INTERVAL"
